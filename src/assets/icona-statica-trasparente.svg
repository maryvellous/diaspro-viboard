<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Text gradient: terracotta → lavender → blue -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8F5A5A"/>
      <stop offset="50%"  stop-color="#9D85C6"/>
      <stop offset="100%" stop-color="#A5C4DC"/>
    </linearGradient>

    <!-- Clip to rounded rect so bubbles don't bleed out (now square) -->
    <clipPath id="clip">
      <rect width="500" height="500" />
    </clipPath>

    <!-- Soft blob blur -->
    <filter id="bblur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <!-- Subtle text glow -->
    <filter id="textglow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Static Bubble Layer (More organic distribution) ── -->
  <g clip-path="url(#clip)" filter="url(#bblur)">
    <ellipse cx="120" cy="85"  rx="65" ry="60" fill="rgba(122,63,103,0.55)"/>
    <ellipse cx="380" cy="150" rx="45" ry="40" fill="rgba(157,133,198,0.45)"/>
    <ellipse cx="180" cy="420" rx="80" ry="75" fill="rgba(107,88,135,0.50)"/>
    <ellipse cx="460" cy="270" rx="35" ry="30" fill="rgba(165,196,220,0.35)"/>
    <ellipse cx="240" cy="140" rx="55" ry="50" fill="rgba(152,167,138,0.40)"/>
    <ellipse cx="340" cy="380" rx="30" ry="28" fill="rgba(143,90,90,0.40)"/>
    <ellipse cx="60"  cy="290" rx="55" ry="50" fill="rgba(122,63,103,0.38)"/>
    <ellipse cx="410" cy="460" rx="40" ry="38" fill="rgba(157,133,198,0.32)"/>
  </g>



  <!-- ── Central V ── -->
  <text
    x="250" y="250"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-size="280"
    font-weight="900"
    fill="url(#textGrad)"
    filter="url(#textglow)">V</text>

</svg>
